; Copy to ../WLED/platformio_override.ini when WLED is a sibling checkout.
; This needs the BusLedTile integration in WLED; stock releases lack the bus.
[platformio]
default_envs = esp32_ledtile

[env:esp32_ledtile]
extends = env:esp32dev
board = esp-wrover-kit
custom_usermods =
build_unflags = ${esp32_idf_V5.build_unflags}
  -D WLED_ENABLE_DMX_INPUT
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags}
  -D WLED_ENABLE_LEDTILE
  -D WLED_DEBUG
  -D WLED_RELEASE_NAME=\"ESP32_LEDTILE\"
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -D LED_TYPES=TYPE_LEDTILE
  -D DATA_PINS=64,16,4,16,2
  -D PIXEL_COUNTS=1024
  -D BTNPIN=0
  -D IRPIN=-1
  -D RLYPIN=-1
lib_deps = ${esp32_idf_V5.lib_deps}
  symlink://../LedBoard/lib/LedTile
upload_speed = 921600

; Original Adafruit HUZZAH32 Feather (ESP32-WROOM, no PSRAM).
; Its USB-UART bridge is most reliable with the conservative 115200 baud rate.
[env:esp32_huzzah32_ledtile]
extends = env:esp32dev
board = featheresp32
custom_usermods =
build_unflags = ${esp32_idf_V5.build_unflags}
  -D WLED_ENABLE_DMX_INPUT
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags}
  -D WLED_ENABLE_LEDTILE
  -D WLED_DEBUG
  -D WLED_RELEASE_NAME=\"ESP32_HUZZAH32_LEDTILE\"
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D WLED_LEDTILE_PINS=16,17,25,26,27,21,4
  -D LED_TYPES=TYPE_LEDTILE
  -D DATA_PINS=64,16,4,16,2
  -D PIXEL_COUNTS=1024
  -D BTNPIN=-1
  -D IRPIN=-1
  -D RLYPIN=-1
lib_deps = ${esp32_idf_V5.lib_deps}
  symlink://../LedBoard/lib/LedTile
upload_speed = 115200
